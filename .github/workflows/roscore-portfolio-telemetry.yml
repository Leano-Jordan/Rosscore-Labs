name: Ross Portfolio Telemetry

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry:
    name: Collect cross-repository portfolio health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect portfolio telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.ROSCORE_TELEMETRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/roscore_portfolio_telemetry.py

      - name: Commit telemetry snapshot
        run: |
          if git status --porcelain -- telemetry/latest.json telemetry/latest.md | grep -q "^"; then
            echo "Telemetry unchanged"
            exit 0
          fi
          git config user.name "Ross Portfolio Telemetry"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry/latest.json telemetry/latest.md
          git commit -m "chore: refresh portfolio telemetry"
          git push
